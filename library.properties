name=SparkFun INA2XX Arduino Library
version=1.0.0
author=SparkFun Electronics <techsupport@sparkfun.com>
maintainer=SparkFun Electronics <sparkfun.com>
sentence=An Arduino library for the INA228 and INA237 Qwiic Power Monitor boards
paragraph=This library provides high-level access to the TI INA228 (20-bit, high-precision) and INA237 (16-bit) digital power/energy/charge monitor ICs over I2C. Supports current, voltage, power, temperature, energy accumulation (INA228), charge accumulation (INA228), alert/diagnostic configuration, and calibration for any shunt resistor.
category=Sensors
